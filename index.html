<style>
  /* ============ TOKENS ============ */
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f6f7f9;
    --ink: #0f2135;
    --ink-soft: #3a4652;
    --muted: #69737d;
    --faint: #99a2ac;
    --border: #eceef1;
    --border-strong: #dfe3e7;

    --accent: #0b996e;
    --accent-hover: #0a875f;
    --accent-tint: #e6f4ee;
    --accent-ink: #076a4b;


    --ok: #12894d;   --ok-bg: #e4f3ea;
    --warn: #b06a12; --warn-bg: #fbeedd;
    --bad: #cf3a3f;  --bad-bg: #fbe9ea;
    --info: #2f6bd8; --info-bg: #e8eefb;
    --violet: #7a4ddb; --violet-bg: #f1ecfb;
    --slate: #607285; --slate-bg: #edf0f3;

    --shadow-sm: 0 1px 2px rgba(15, 33, 53, .05);
    --shadow-md: 0 16px 40px -16px rgba(15, 33, 53, .16), 0 2px 8px rgba(15, 33, 53, .05);
    --radius: 12px;
    --radius-sm: 8px;

    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, "Segoe UI", Roboto, sans-serif;
    --heading: "Montserrat", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Menlo", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1218;
      --surface: #121b23;
      --surface-2: #0e161d;
      --ink: #eef2f5;
      --ink-soft: #c7cfd6;
      --muted: #8b959e;
      --faint: #6a747d;
      --border: #212e37;
      --border-strong: #2e3c46;

      --accent: #1fbf88;
      --accent-hover: #34cd99;
      --accent-tint: #123528;
      --accent-ink: #6fe7c1;


      --ok: #46c07d;   --ok-bg: #163220;
      --warn: #dc9a4d; --warn-bg: #342612;
      --bad: #e5686c;  --bad-bg: #35201f;
      --info: #6f9bef; --info-bg: #1a2647;
      --violet: #a281ea; --violet-bg: #251b3e;
      --slate: #92a0b0; --slate-bg: #202b35;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .32);
      --shadow-md: 0 18px 44px -18px rgba(0, 0, 0, .6), 0 2px 10px rgba(0, 0, 0, .32);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0b1218;
    --surface: #121b23;
    --surface-2: #0e161d;
    --ink: #eef2f5;
    --ink-soft: #c7cfd6;
    --muted: #8b959e;
    --faint: #6a747d;
    --border: #212e37;
    --border-strong: #2e3c46;

    --accent: #1fbf88;
    --accent-hover: #34cd99;
    --accent-tint: #123528;
    --accent-ink: #6fe7c1;


    --ok: #46c07d;   --ok-bg: #163220;
    --warn: #dc9a4d; --warn-bg: #342612;
    --bad: #e5686c;  --bad-bg: #35201f;
    --info: #6f9bef; --info-bg: #1a2647;
    --violet: #a281ea; --violet-bg: #251b3e;
    --slate: #92a0b0; --slate-bg: #202b35;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .32);
    --shadow-md: 0 18px 44px -18px rgba(0, 0, 0, .6), 0 2px 10px rgba(0, 0, 0, .32);
  }

  /* ============ BASE ============ */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  img { max-width: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { margin: 0; font-family: var(--heading); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; font-size: 14px; }
  a { color: var(--accent); }
  ::selection { background: var(--accent-tint); color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* ============ SHELL ============ */
  .app {
    display: grid;
    grid-template-columns: 244px 1fr;
    min-height: 100vh;
  }

  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 18px 12px;
    gap: 1px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 20px;
  }
  .brand-mark {
    height: 30px; width: auto; flex: none;
    display: flex; align-items: center;
    color: var(--accent);
    font-weight: 800; font-size: 15px; letter-spacing: -0.03em;
  }
  .brand-mark svg { height: 100%; width: auto; display: block; }
  .brand-mark img { height: 100%; width: auto; display: block; }
  .brand-name { font-family: var(--heading); font-weight: 700; font-size: 15px; letter-spacing: -0.01em; line-height: 1.15; }
  .brand-sub { font-size: 10px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; margin-top: 1px; }

  .nav-label {
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--faint);
    padding: 16px 12px 7px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 12px; border-radius: var(--radius-sm);
    color: var(--ink-soft); text-decoration: none;
    border: none; background: none; width: 100%; text-align: left;
    font-size: 13.5px; font-weight: 500;
    transition: background .12s, color .12s;
  }
  .nav-item svg { flex: none; opacity: .65; transition: opacity .12s; }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item:hover svg { opacity: .9; }
  .nav-item.active { background: var(--accent-tint); color: var(--accent-ink); font-weight: 600; }
  .nav-item.active svg { opacity: 1; }
  .sidebar-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }

  .main { min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 12px clamp(16px, 3vw, 40px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .topbar .spacer { flex: 1; }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 13px;
    width: 250px; color: var(--muted);
    transition: border-color .12s, background .12s;
  }
  .search:focus-within { border-color: var(--accent); background: var(--surface); }
  .search input { border: none; background: none; outline: none; color: var(--ink); width: 100%; }
  .search input::placeholder { color: var(--faint); }

  .content { padding: 26px clamp(16px, 3vw, 40px) 80px; width: 100%; max-width: none; }

  .hamburger { display: none; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px; color: var(--ink); }

  /* ============ BUTTONS ============ */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 15px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--ink); font-size: 13px; font-weight: 600;
    transition: background .12s, border-color .12s, transform .06s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.danger { color: var(--bad); border-color: transparent; background: transparent; }
  .btn.danger:hover { background: var(--bad-bg); }
  .btn.sm { padding: 6px 11px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .menu-wrap { position: relative; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow-md);
    padding: 6px; min-width: 190px; z-index: 40;
  }
  .menu button {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 8px 10px; border: none; background: none; border-radius: 7px;
    color: var(--ink); font-size: 13px; font-weight: 500; text-align: left;
  }
  .menu button:hover { background: var(--surface-2); }

  /* ============ CARDS / SECTIONS ============ */
  .view { display: none; animation: fade .18s ease both; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }

  .greet { margin: 2px 0 22px; }
  .greet-title { font-size: 25px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
  .greet-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .section-head { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; }
  .section-head h2 { font-size: 15px; }
  .section-head .count { font-size: 12px; font-weight: 600; color: var(--faint); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
  }

  .grid-kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .kpi .k-label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .kpi .k-value { font-family: var(--heading); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-top: 10px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .kpi .k-note { font-size: 12px; color: var(--faint); margin-top: 4px; }
  .kpi .k-note strong { color: var(--accent); font-weight: 600; }

  .grid-2 { display: grid; grid-template-columns: 1.15fr .85fr; gap: 12px; align-items: start; }

  /* ============ TABLE ============ */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 11px; font-weight: 600;
    letter-spacing: .02em; color: var(--muted);
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  tbody td { padding: 13px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .1s; }
  tbody tr.clickable:hover { background: var(--surface-2); cursor: pointer; }
  .cell-main { font-weight: 600; color: var(--ink); }
  .cell-sub { font-size: 12px; color: var(--faint); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ============ CHIPS / BADGES / AVATAR ============ */
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: 11px; font-weight: 700;
    background: var(--accent-tint); color: var(--accent-ink);
  }
  .avatar.lg { width: 44px; height: 44px; font-size: 15px; }
  .tag {
    display: inline-flex; align-items: center;
    padding: 2px 8px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border);
    font-size: 11.5px; color: var(--muted); font-weight: 500;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; white-space: nowrap;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.s-nuevo { color: var(--slate); background: var(--slate-bg); }
  .badge.s-contactado { color: var(--info); background: var(--info-bg); }
  .badge.s-propuesta { color: var(--violet); background: var(--violet-bg); }
  .badge.s-negociacion { color: var(--warn); background: var(--warn-bg); }
  .badge.s-ganado { color: var(--ok); background: var(--ok-bg); }
  .badge.s-perdido { color: var(--bad); background: var(--bad-bg); }

  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 999px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .pill.on { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); background: var(--accent-tint); color: var(--accent-ink); }
  .pill.on .dot { background: var(--accent); }

  /* ============ DASHBOARD LISTS ============ */
  .list { display: flex; flex-direction: column; }
  .row-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 4px; border-bottom: 1px solid var(--border);
  }
  .row-item:last-child { border-bottom: none; }
  .row-item .ri-body { min-width: 0; flex: 1; }
  .row-item .ri-title { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-item .ri-meta { font-size: 12px; color: var(--faint); }
  .row-item .ri-time { font-size: 11.5px; font-weight: 500; color: var(--muted); white-space: nowrap; }

  .type-ic {
    width: 28px; height: 28px; border-radius: 8px; flex: none;
    display: grid; place-items: center; color: var(--muted);
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .type-ic.llamada { color: var(--info); }
  .type-ic.reunion { color: var(--violet); }
  .type-ic.email { color: var(--accent); }
  .type-ic.tarea { color: var(--warn); }

  /* ============ CHART ============ */
  .chart { width: 100%; height: 210px; display: block; }
  .chart text { font-family: var(--sans); }

  /* ============ KANBAN ============ */
  .kanban { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; }
  .kcol {
    flex: 0 0 260px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px; display: flex; flex-direction: column; gap: 9px;
  }
  .kcol.drop { border-color: var(--accent); background: var(--accent-tint); }
  .kcol-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 2px; }
  .kcol-head .kt { font-size: 12px; font-weight: 700; letter-spacing: .02em; }
  .kcol-head .ks { font-size: 11px; font-weight: 500; color: var(--muted); }
  .deal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 11px 12px;
    box-shadow: var(--shadow-sm); cursor: grab;
  }
  .deal:active { cursor: grabbing; }
  .deal.dragging { opacity: .4; }
  .deal .d-title { font-weight: 600; font-size: 13px; line-height: 1.35; }
  .deal .d-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; }
  .deal .d-val { font-weight: 700; font-size: 12.5px; }
  .deal .d-contact { font-size: 11.5px; color: var(--faint); display: flex; align-items: center; gap: 6px; }

  /* ============ ACTIVITIES ============ */
  .day-group { margin-bottom: 20px; }
  .day-head { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; padding-left: 2px; }
  .act {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 8px;
  }
  .act.done { opacity: .62; }
  .act.done .a-title { text-decoration: line-through; text-decoration-color: var(--faint); }
  .chk {
    width: 18px; height: 18px; border-radius: 6px; flex: none; margin-top: 1px;
    border: 1.5px solid var(--border-strong); background: var(--surface);
    display: grid; place-items: center; color: #fff;
  }
  .chk.on { background: var(--accent); border-color: var(--accent); }
  .a-body { flex: 1; min-width: 0; }
  .a-title { font-weight: 600; font-size: 13.5px; }
  .a-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 5px; font-size: 12px; color: var(--faint); align-items: center; }
  .a-meta .mchip { display: inline-flex; align-items: center; gap: 5px; }
  .g-flag { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 600; font-size: 11.5px; }
  .a-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .a-time { font-size: 11.5px; font-weight: 500; color: var(--muted); white-space: nowrap; }

  /* ============ CALENDAR ============ */
  .cal-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .cal-head .cal-month { font-size: 16px; font-weight: 700; min-width: 190px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--border); gap: 1px; }
  .cal-dow { background: var(--surface-2); padding: 8px 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); text-align: left; }
  .cal-cell { background: var(--surface); min-height: 104px; padding: 7px 8px; display: flex; flex-direction: column; gap: 4px; }
  .cal-cell.out { background: var(--surface-2); }
  .cal-cell.today .cal-num { background: var(--accent); color: #fff; }
  .cal-num { font-size: 11px; font-weight: 600; color: var(--muted); width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px; }
  .cal-ev { font-size: 11px; padding: 2px 6px; border-radius: 5px; background: var(--accent-tint); color: var(--accent-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .cal-ev.g { background: var(--info-bg); color: var(--info); }
  .cal-ev.done { opacity: .5; }
  .cal-more { font-size: 10.5px; color: var(--faint); }

  /* ============ DRAWER ============ */
  .scrim { position: fixed; inset: 0; background: rgba(12, 18, 26, .42); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .16s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 420px; max-width: 92vw;
    background: var(--surface); border-left: 1px solid var(--border);
    z-index: 61; transform: translateX(100%); transition: transform .2s ease;
    display: flex; flex-direction: column; box-shadow: var(--shadow-md);
  }
  .drawer.on { transform: none; }
  .drawer-head { padding: 20px; border-bottom: 1px solid var(--border); display: flex; gap: 13px; align-items: flex-start; }
  .drawer-body { padding: 20px; overflow-y: auto; flex: 1; }
  .drawer h4 { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
  .drawer h4:first-child { margin-top: 0; }
  .kv { display: grid; grid-template-columns: 84px 1fr; gap: 4px 12px; font-size: 13px; }
  .kv dt { color: var(--faint); }
  .kv dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  .mini-deal { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .mini-deal:last-child { border-bottom: none; }

  /* ============ MODAL ============ */
  .modal-card {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -46%);
    width: 460px; max-width: 92vw; max-height: 88vh; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; box-shadow: var(--shadow-md); z-index: 61;
    opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s;
  }
  .modal-card.on { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  .modal-head { padding: 18px 20px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 700; }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .field input, .field select, .field textarea {
    padding: 10px 13px; border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); background: var(--surface); color: var(--ink);
    outline: none; transition: border-color .12s, box-shadow .12s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .field textarea { resize: vertical; min-height: 66px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ============ TOASTS ============ */
  .toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast {
    background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
    box-shadow: var(--shadow-md); animation: pop .2s ease both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } }

  /* ============ SETTINGS ============ */
  .set-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; max-width: 620px; }
  .set-card h3 { font-size: 14px; margin-bottom: 4px; }
  .set-card p.desc { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .status-line { display: flex; align-items: center; gap: 9px; padding: 11px 13px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); font-size: 13px; font-weight: 500; margin-bottom: 14px; }
  .status-line .sd { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .status-line.ok .sd { background: var(--ok); }
  .status-line.off .sd { background: var(--faint); }
  .status-line.warn .sd { background: var(--warn); }
  details.help { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 13px; margin-top: 12px; }
  details.help summary { padding: 11px 0; font-weight: 600; font-size: 13px; cursor: pointer; }
  details.help ol { margin: 0 0 14px; padding-left: 20px; color: var(--ink-soft); font-size: 13px; line-height: 1.7; }
  details.help code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
  .seg button { padding: 7px 14px; border: none; background: var(--surface); color: var(--muted); font-size: 12.5px; font-weight: 600; border-right: 1px solid var(--border); }
  .seg button:last-child { border-right: none; }
  .seg button.on { background: var(--accent-tint); color: var(--accent-ink); }

  .empty { text-align: center; color: var(--faint); padding: 40px 20px; font-size: 13px; }

  .banner {
    display: flex; align-items: center; gap: 10px;
    background: var(--accent-tint); color: var(--accent-ink);
    border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--border));
    border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12.5px; font-weight: 500;
    margin-bottom: 18px;
  }
  .banner button { margin-left: auto; }

  /* ============ RESPONSIVE ============ */
  .table-wrap { overflow-x: auto; }
  table { min-width: 560px; }

  @media (max-width: 1200px) {
    .grid-2 { grid-template-columns: 1fr; }
  }
  @media (max-width: 1000px) {
    .grid-kpi { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed; z-index: 70; width: 244px; left: 0; top: 0;
      transform: translateX(-100%); transition: transform .2s ease;
    }
    .sidebar.on { transform: none; }
    .hamburger { display: inline-flex; }
    .search { width: 150px; }
    .topbar { padding: 12px 16px; gap: 10px; }
    #newBtn span, #newBtn { font-size: 12px; }
  }
  @media (max-width: 620px) {
    .topbar { flex-wrap: wrap; }
    .topbar h1 { font-size: 16px; }
    .search { display: none; }
    .section-head { flex-wrap: wrap; }
    .grid-kpi { grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi .k-value { font-size: 22px; }
    .drawer { width: 100%; max-width: 100%; }
    .modal-card { width: 100%; max-width: 100%; border-radius: 16px 16px 0 0; top: auto; bottom: 0; transform: translate(-50%, 100%); left: 50%; }
    .modal-card.on { transform: translate(-50%, 0); }
    .field-row { grid-template-columns: 1fr; }
    .cal-cell { min-height: 76px; }
    .cal-ev { font-size: 10px; }
    .auth-card { padding: 20px; }
  }
  @media (max-width: 420px) {
    .grid-kpi { grid-template-columns: 1fr; }
  }

  /* ============ THEME TOGGLE ============ */
  .icon-btn {
    display: inline-grid; place-items: center;
    width: 36px; height: 36px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-soft);
    transition: background .12s, color .12s, border-color .12s;
  }
  .icon-btn:hover { background: var(--surface); border-color: var(--border-strong); color: var(--ink); }

  /* ============ AUTH ============ */
  .auth {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg); color: var(--ink);
    display: grid; place-items: center; padding: 24px; overflow-y: auto;
  }
  .auth-inner { width: 400px; max-width: 100%; }
  .auth-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-left: 2px; }
  .auth-brand .brand-mark { height: 40px; }
  .auth-brand .brand-name { font-size: 18px; }
  .auth-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; box-shadow: var(--shadow-md); padding: 26px;
  }
  .auth-card h2 { font-size: 17px; margin-bottom: 4px; }
  .auth-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .auth-tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 4px; margin-bottom: 18px; }
  .auth-tabs button { flex: 1; padding: 8px; border: none; background: none; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--muted); font-family: inherit; }
  .auth-tabs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .auth-form { display: flex; flex-direction: column; gap: 13px; }
  .auth-err { color: var(--bad); font-size: 12.5px; min-height: 1.1em; font-weight: 500; }
  .auth-hint { text-align: center; font-size: 12px; color: var(--faint); margin-top: 16px; }
  .auth-hint code { font-family: var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; color: var(--ink-soft); }
  .auth-toprow { display: flex; justify-content: flex-end; margin-bottom: 10px; }

  .me-box { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--radius-sm); }
  .me-box .me-info { min-width: 0; flex: 1; }
  .me-box .me-name { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me-box .me-mail { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me-box .me-out { border: none; background: none; color: var(--faint); padding: 4px; border-radius: 6px; display: grid; place-items: center; }
  .me-box .me-out:hover { background: var(--surface-2); color: var(--bad); }

  .emp-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .emp-row:last-child { border-bottom: none; }
  .emp-row .emp-id { font-size: 11.5px; color: var(--muted); }
  .emp-row .you { font-size: 10.5px; font-weight: 700; color: var(--accent-ink); background: var(--accent-tint); padding: 1px 6px; border-radius: 999px; }
</style>

  }

    var d = new Date(iso), now = new Date();
    var diff = Math.round((new Date(dayKey(d)) - new Date(dayKey(now))) / 86400000);
    if (diff === 0) return "Hoy";
    if (diff === 1) return "Mañana";

    return d.toLocaleDateString(LOCALE, { weekday: "long", day: "numeric", month: "long", timeZone: TZ });

  function hashPass(pw, salt) {
    var s = "cad|" + salt + "|" + pw + "|encia";
    var h1 = 5381, h2 = 2166136261;
    for (var i = 0; i < s.length; i++) { h1 = (((h1 << 5) + h1) ^ s.charCodeAt(i)) >>> 0; }
    for (var j = s.length - 1; j >= 0; j--) { h2 = ((h2 ^ s.charCodeAt(j)) * 16777619) >>> 0; }
    return h1.toString(16).padStart(8, "0") + h2.toString(16).padStart(8, "0");
  }
  function currentEmployee() {
    if (!state.session) return null;

  function empByLogin(v) {
    var q = String(v || "").trim().toLowerCase();
    return (state.employees || []).find(function (e) {
      return e.id.toLowerCase() === q || (e.email || "").toLowerCase() === q;
    }) || null;

  function createEmployee(f) {
    var id = (f.empId || "").trim();
    var email = (f.email || "").trim();
    if (!id) return "Indica un ID de empleado.";
    if (!f.name || !f.name.trim()) return "Indica el nombre.";
    if (!EMAIL_RE.test(email)) return "El correo no es válido.";
    if ((f.pass || "").length < 4) return "La clave debe tener al menos 4 caracteres.";
    if (f.pass2 != null && f.pass !== f.pass2) return "Las claves no coinciden.";
    if ((state.employees || []).some(function (e) { return e.id.toLowerCase() === id.toLowerCase(); })) return "Ese ID ya está en uso.";
    if ((state.employees || []).some(function (e) { return (e.email || "").toLowerCase() === email.toLowerCase(); })) return "Ese correo ya está registrado.";
    var salt = Math.random().toString(36).slice(2, 10);
    var emp = { id: id, name: f.name.trim(), email: email, salt: salt, hash: hashPass(f.pass, salt), createdAt: new Date().toISOString() };
    state.employees.push(emp);
    return emp;
  }

  // ============ IMPORT / EXPORT (CSV · Excel) ============
  var CSV_COLS = ["Nombre", "Empresa", "Email", "Teléfono", "Etiquetas", "Propietario"];
  function contactsToAoA() {
    var rows = [CSV_COLS.slice()];
    state.contacts.forEach(function (c) {
      rows.push([c.name || "", c.company || "", c.email || "", c.phone || "", (c.tags || []).join("; "), c.owner || ""]);
    });
    return rows;
  }
  function aoaToCsv(rows) {
    return rows.map(function (r) {
      return r.map(function (v) {
        v = v == null ? "" : String(v);
        return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(",");
    }).join("\r\n");
  }
  function parseCsv(text) {
    var rows = [], row = [], cur = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else { q = false; } }
        else cur += ch;
      } else {
        if (ch === '"') q = true;
        else if (ch === "," || ch === ";") { row.push(cur); cur = ""; }
        else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
        else if (ch === "\r") { /* skip */ }
        else cur += ch;
      }
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ""; }); });
  }
  function norm(s) { return String(s || "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function importContactAoA(rows) {
    if (!rows.length) return { added: 0, updated: 0 };
    var head = rows[0].map(norm);
    function col(names) { for (var k = 0; k < names.length; k++) { var idx = head.indexOf(names[k]); if (idx >= 0) return idx; } return -1; }
    var iName = col(["nombre", "name", "nombre completo", "contacto"]);
    var iComp = col(["empresa", "company", "compañia", "organizacion"]);
    var iMail = col(["email", "correo", "correo electronico", "e-mail"]);
    var iPhone = col(["telefono", "teléfono", "phone", "movil", "móvil", "celular"]);
    var iTags = col(["etiquetas", "tags", "etiqueta"]);
    var iOwner = col(["propietario", "owner", "responsable"]);
    if (iName < 0 && iMail < 0) throw new Error("No encuentro columnas «Nombre» ni «Email» en la cabecera.");
    var me = currentEmployee();
    var added = 0, updated = 0;
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      var rec = {
        name: iName >= 0 ? String(row[iName] || "").trim() : "",
        company: iComp >= 0 ? String(row[iComp] || "").trim() : "",
        email: iMail >= 0 ? String(row[iMail] || "").trim() : "",
        phone: iPhone >= 0 ? String(row[iPhone] || "").trim() : "",
        tags: iTags >= 0 ? String(row[iTags] || "").split(/[;,/|]/).map(function (t) { return t.trim(); }).filter(Boolean) : [],
        owner: iOwner >= 0 && row[iOwner] ? String(row[iOwner]).trim() : (me ? me.name : "")
      };
      if (!rec.name && !rec.email) continue;
      if (!rec.name) rec.name = rec.email.split("@")[0];
      var existing = rec.email ? state.contacts.find(function (c) { return (c.email || "").toLowerCase() === rec.email.toLowerCase(); }) : null;
      if (existing) { Object.assign(existing, rec); updated++; }
      else { state.contacts.push(Object.assign({ id: uid("c") }, rec)); added++; }
    }
    return { added: added, updated: updated };
  }
  function triggerDownload(filename, blob) {
    try {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 200);
      return true;
    } catch (e) { return false; }
  }
  function exportContacts(fmt) {
    var rows = contactsToAoA();
    var stamp = new Date().toISOString().slice(0, 10);
    var plainCsv = aoaToCsv(rows);
    // Copia siempre visible: en entornos que bloquean descargas (Artifact) es la vía de salida.
    var ta = $("#ieCsvOut"); if (ta) { ta.hidden = false; ta.value = plainCsv; }
    if (fmt === "xlsx" && window.XLSX) {
      try {
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "Contactos");
        XLSX.writeFile(wb, "contactos-" + stamp + ".xlsx");
        toast("Excel generado (si no se descarga, copia el CSV de abajo)");
        return;
      } catch (e) { /* fall through to csv */ }
    }
    var ok = triggerDownload("contactos-" + stamp + ".csv", new Blob(["﻿" + plainCsv], { type: "text/csv;charset=utf-8" }));
    toast(ok ? "CSV descargado" : "Copia el CSV del cuadro de abajo");
    if (ta) { ta.focus(); ta.select(); }
  }

  function openImportExport() {
    openModalRaw("Importar / exportar contactos",
      '<div class="field"><label>Archivo CSV o Excel (.xlsx)</label>' +
      '<input type="file" id="ieFile" accept=".csv,.xlsx,.xls,text/csv"></div>' +
      '<div class="field"><label>…o pega aquí el CSV</label>' +
      '<textarea id="iePaste" placeholder="Nombre,Empresa,Email,Teléfono,Etiquetas" style="min-height:90px;font-family:var(--mono);font-size:11px"></textarea></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button type="button" class="btn primary" id="ieImport">Importar</button>' +
        '<button type="button" class="btn" id="ieExpCsv">Exportar CSV</button>' +
        '<button type="button" class="btn" id="ieExpXlsx">Exportar Excel</button>' +
      '</div>' +
      '<p style="font-size:12px;color:var(--muted);margin:2px 0 0">Columnas reconocidas: Nombre, Empresa, Email, Teléfono, Etiquetas, Propietario. Se actualizan los contactos cuyo email coincida.</p>' +
      '<textarea id="ieCsvOut" hidden readonly style="min-height:110px;font-family:var(--mono);font-size:11px"></textarea>',
      null);
    $("#modalSave").style.display = "none";
    $("#modalCancel").textContent = "Cerrar";

    $("#ieExpCsv").addEventListener("click", function () { exportContacts("csv"); });
    $("#ieExpXlsx").addEventListener("click", function () { exportContacts(window.XLSX ? "xlsx" : "csv"); });
    $("#ieImport").addEventListener("click", function () {
      var file = $("#ieFile").files && $("#ieFile").files[0];
      var pasted = $("#iePaste").value.trim();
      var done = function (rows) {
        try {
          var res = importContactAoA(rows);
          state.isDemo = false; save(); closeModal(); refresh();
          toast(res.added + " añadidos · " + res.updated + " actualizados");
        } catch (err) { toast("Importación: " + err.message); }
      };
      if (file) {
        var isXlsx = /\.x(lsx|ls)$/i.test(file.name);
        if (isXlsx && !window.XLSX) { toast("No pude cargar el lector de Excel. Guarda el archivo como CSV e impórtalo."); return; }
        var reader = new FileReader();
        reader.onload = function () {
          if (isXlsx && window.XLSX) {
            try {
              var wb = XLSX.read(reader.result, { type: "array" });
              var sh = wb.Sheets[wb.SheetNames[0]];
              done(XLSX.utils.sheet_to_json(sh, { header: 1, raw: false, defval: "" }));
            } catch (e) { toast("No pude leer el Excel: " + e.message); }
          } else {
            done(parseCsv(typeof reader.result === "string" ? reader.result : new TextDecoder().decode(reader.result)));
          }
        };
        if (isXlsx && window.XLSX) reader.readAsArrayBuffer(file);
        else reader.readAsText(file, "utf-8");
      } else if (pasted) {
        done(parseCsv(pasted));
      } else {
        toast("Elige un archivo o pega el CSV");
      }
    });
  }

  function stageChart(openDeals) {
    var data = OPEN_STAGES.map(function (id) {
      return { id: id, label: stageLabel(id), value: openDeals.filter(function (d) { return d.stage === id; }).reduce(function (s, d) { return s + (d.value || 0); }, 0) };
    });
    var max = Math.max.apply(null, data.map(function (d) { return d.value; }).concat([1]));
    var W = 340, H = 200, padB = 40, padT = 24, padL = 6, padR = 6;
    var bw = (W - padL - padR) / data.length;
    var bars = data.map(function (d, i) {
      var h = d.value === 0 ? 2 : Math.round((d.value / max) * (H - padB - padT));
      var x = padL + i * bw + bw * 0.18;
      var w = bw * 0.64;
      var y = H - padB - h;
      var op = 0.45 + 0.18 * i;
      return '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h + '" rx="5" fill="var(--accent)" fill-opacity="' + op.toFixed(2) + '"/>' +
        '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (y - 7).toFixed(1) + '" text-anchor="middle" font-size="10" fill="var(--ink)">' + shortMoney(d.value) + '</text>' +
        '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - padB + 16) + '" text-anchor="middle" font-size="9.5" fill="var(--muted)">' + esc(d.label) + '</text>';
    }).join("");
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Valor del pipeline por etapa">' +
      '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) + '" y2="' + (H - padB) + '" stroke="var(--border-strong)" stroke-width="1"/>' +
      bars + '</svg>';
  }
  function shortMoney(n) {
    n = Math.round(n || 0);
    if (n >= 1000000) return "$" + (n / 1000000).toFixed(n % 1000000 === 0 ? 0 : 1).replace(".", ",") + "M";
    if (n >= 1000) return "$" + Math.round(n / 1000) + "k";
    return "$" + n;
  }

  // ============ CALENDAR ============
  function renderCalendar() {
    var ref = runtime.calRef;
    var monthName = new Date(ref.getFullYear(), ref.getMonth(), 15).toLocaleDateString(LOCALE, { month: "long", year: "numeric" });
    var first = startOfMonth(ref);
    var startDow = (first.getDay() + 6) % 7; // Monday first
    var gridStart = new Date(first.getFullYear(), first.getMonth(), 1 - startDow);
    var dows = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];

    var actByDay = {};
    state.activities.forEach(function (a) { (actByDay[dayKey(a.datetime)] || (actByDay[dayKey(a.datetime)] = [])).push(a); });
    var gByDay = {};
    runtime.gEvents.forEach(function (e) {
      var st = e.start && (e.start.dateTime || e.start.date);
      if (!st) return;
      (gByDay[dayKey(st)] || (gByDay[dayKey(st)] = [])).push(e);
    });

    var cells = "";
    for (var i = 0; i < 42; i++) {
      var day = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      var k = dayKey(day);
      var out = day.getMonth() !== ref.getMonth();
      var isToday = sameDay(day, new Date());
      var items = (actByDay[k] || []).slice().sort(function (a, b) { return new Date(a.datetime) - new Date(b.datetime); });
      var gitems = gByDay[k] || [];
      var evs = items.slice(0, 3).map(function (a) {
        return '<div class="cal-ev ' + (a.done ? "done" : "") + '" data-edit-activity="' + a.id + '" title="' + esc(a.title) + '">' + fmtTime(a.datetime) + ' ' + esc(a.title) + '</div>';
      }).join("");
      evs += gitems.slice(0, 2).map(function (e) {
        return '<div class="cal-ev g" title="Google Calendar: ' + esc(e.summary || "") + '">' + esc(e.summary || "(sin título)") + '</div>';
      }).join("");
      var extra = (items.length - 3) + (gitems.length - 2 > 0 ? gitems.length - 2 : 0);
      var moreCount = Math.max(0, items.length - 3) + Math.max(0, gitems.length - 2);
      cells += '<div class="cal-cell ' + (out ? "out" : "") + ' ' + (isToday ? "today" : "") + '" data-day="' + k + '">' +
        '<div class="cal-num">' + day.getDate() + '</div>' + evs +
        (moreCount > 0 ? '<div class="cal-more">+' + moreCount + ' más</div>' : '') +
        '</div>';
    }

    $("#view-calendar").innerHTML =
      '<div class="cal-head">' +
        '<button class="btn sm" id="calPrev" aria-label="Mes anterior">‹</button>' +
        '<div class="cal-month" style="text-transform:capitalize">' + esc(monthName) + '</div>' +
        '<button class="btn sm" id="calNext" aria-label="Mes siguiente">›</button>' +
        '<button class="btn sm" id="calToday">Hoy</button>' +
        '<div style="flex:1"></div>' +
        (runtime.token ? '<button class="btn sm" id="calSync">Sincronizar Google</button>' : '<span class="cell-sub">Actividades del CRM · <a href="#settings">conectar Google</a></span>') +
      '</div>' +
      '<div class="cal-grid">' +
        dows.map(function (d) { return '<div class="cal-dow">' + d + '</div>'; }).join("") +
        cells +
      '</div>';

    $("#calPrev").addEventListener("click", function () { runtime.calRef = new Date(runtime.calRef.getFullYear(), runtime.calRef.getMonth() - 1, 1); renderCalendar(); });
    $("#calNext").addEventListener("click", function () { runtime.calRef = new Date(runtime.calRef.getFullYear(), runtime.calRef.getMonth() + 1, 1); renderCalendar(); });
    $("#calToday").addEventListener("click", function () { runtime.calRef = startOfMonth(new Date()); renderCalendar(); });
    var cs = $("#calSync"); if (cs) cs.addEventListener("click", function () { syncGoogleEvents(true); });
    $all("#view-calendar .cal-cell").forEach(function (cell) {
      cell.addEventListener("click", function (e) {
        if (e.target.closest("[data-edit-activity]")) return;
        openActivityModal(null, { datetime: cell.dataset.day + "T10:00" });
      });
    });
  }

  // ============ GOOGLE CALENDAR ============
  function loadGsi() {
    var s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true; s.defer = true;
    s.onload = function () {
      runtime.gsi = !!(window.google && google.accounts && google.accounts.oauth2);
      if (currentView === "settings") renderSettings();
      updateGooglePill();
    };
    s.onerror = function () { runtime.gsi = false; if (currentView === "settings") renderSettings(); updateGooglePill(); };
    document.head.appendChild(s);
    setTimeout(function () {
      if (runtime.gsi === undefined) { runtime.gsi = false; if (currentView === "settings") renderSettings(); updateGooglePill(); }
    }, 4000);
  }

  function connectGoogle() {
    var cid = (state.settings.googleClientId || "").trim();
    if (!cid) { toast("Introduce tu OAuth Client ID"); return; }
    if (!runtime.gsi) { toast("Google no está disponible en este entorno"); return; }
    try {
      runtime.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: cid,
        scope: GOOGLE_SCOPE,
        callback: function (resp) {
          if (resp && resp.access_token) {
            runtime.token = resp.access_token;
            runtime.tokenExp = Date.now() + (Number(resp.expires_in || 3600) * 1000);
            toast("Google Calendar conectado");
            if (currentView === "settings") renderSettings();
            updateGooglePill();
            syncGoogleEvents(false);
          } else {
            toast("No se pudo autorizar");
          }
        }
      });
      runtime.tokenClient.requestAccessToken();
    } catch (e) {
      toast("Error al iniciar OAuth: " + e.message);
    }
  }
  function disconnectGoogle() {
    if (runtime.token && window.google && google.accounts && google.accounts.oauth2) {
      try { google.accounts.oauth2.revoke(runtime.token); } catch (e) {}
    }
    runtime.token = null; runtime.tokenExp = 0; runtime.gEvents = [];
    if (currentView === "settings") renderSettings();
    if (currentView === "calendar") renderCalendar();
    updateGooglePill();
    toast("Google Calendar desconectado");
  }
  function tokenValid() { return runtime.token && Date.now() < runtime.tokenExp; }

  function syncGoogleEvents(loud) {
    if (!tokenValid()) { if (loud) toast("Conecta Google Calendar primero"); return; }
    var ref = runtime.calRef;
    var timeMin = new Date(ref.getFullYear(), ref.getMonth() - 1, 1).toISOString();
    var timeMax = new Date(ref.getFullYear(), ref.getMonth() + 2, 1).toISOString();
    var url = "https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=250" +
      "&timeMin=" + encodeURIComponent(timeMin) + "&timeMax=" + encodeURIComponent(timeMax);
    fetch(url, { headers: { Authorization: "Bearer " + runtime.token } })
      .then(function (r) {
        if (r.status === 401) { runtime.token = null; throw new Error("Sesión de Google expirada"); }
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        runtime.gEvents = (data.items || []).filter(function (e) { return e.status !== "cancelled"; });
        if (currentView === "calendar") renderCalendar();
        if (loud) toast(runtime.gEvents.length + " eventos de Google cargados");
      })
      .catch(function (err) {
        if (currentView === "settings") renderSettings();
        updateGooglePill();
        toast("Google: " + err.message + " (¿entorno restringido?)");
      });
  }

  function pushActivityToGoogle(a) {
    if (!tokenValid()) { toast("Conecta Google Calendar primero"); go("settings"); return; }
    var start = new Date(a.datetime);
    var end = new Date(start.getTime() + (a.durationMin || 30) * 60000);
    var c = contactById(a.contactId);
    var body = {
      summary: a.title,
      description: (c ? "Contacto: " + c.name + " (" + (c.email || "") + ")\n" : "") + (a.notes || "") + "\n— 3D Products Chile CRM",
      start: { dateTime: start.toISOString() },
      end: { dateTime: end.toISOString() }
    };
    fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
      method: "POST",
      headers: { Authorization: "Bearer " + runtime.token, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (ev) {
        a.googleEventId = ev.id; save(); refresh();
        toast("Añadido a Google Calendar");
      })
      .catch(function (err) { toast("No se pudo crear el evento: " + err.message); });
  }

  function updateGooglePill() {
    var pill = $("#gPill"), txt = $("#gPillText");
    if (tokenValid()) { pill.classList.add("on"); txt.textContent = "Google · conectado"; }
    else if (runtime.gsi === false) { pill.classList.remove("on"); txt.textContent = "Google · no disponible"; }
    else { pill.classList.remove("on"); txt.textContent = "Google · conectar"; }
  }

    d = d || null;
    var contactOpts = [{ value: "", label: "— Sin contacto —" }].concat(state.contacts.map(function (c) { return { value: c.id, label: c.name + " · " + c.company }; }));
    openModal(d ? "Editar negocio" : "Nuevo negocio", [
      { name: "title", label: "Título", required: true, value: d && d.title, placeholder: "Ej. Plan Pro anual — Empresa" },
      { name: "value", label: "Valor (CLP)", type: "number", step: "1000", value: d && d.value },
      { name: "stage", label: "Etapa", type: "select", value: d ? d.stage : "nuevo", options: STAGES.map(function (s) { return { value: s.id, label: s.label }; }) },
      { name: "contactId", label: "Contacto", type: "select", value: d && d.contactId, options: contactOpts },
      { name: "closeDate", label: "Cierre previsto", type: "date", value: d && d.closeDate ? d.closeDate.slice(0, 10) : "" }
    ], function (f) {
      var payload = {
        title: f.title, value: Number(f.value) || 0, stage: f.stage,
        contactId: f.contactId || null,
        closeDate: f.closeDate ? new Date(f.closeDate + "T00:00:00").toISOString() : null
      };
      if (d) Object.assign(d, payload);
      else state.deals.push(Object.assign({ id: uid("d") }, payload));
      state.isDemo = false; save(); closeModal(); refresh();
      toast(d ? "Negocio actualizado" : "Negocio creado");
    });
  }

  function openActivityModal(a, preset) {
    a = a || null; preset = preset || {};
    var contactOpts = [{ value: "", label: "— Sin contacto —" }].concat(state.contacts.map(function (c) { return { value: c.id, label: c.name }; }));
    var dealOpts = [{ value: "", label: "— Sin negocio —" }].concat(state.deals.map(function (d) { return { value: d.id, label: d.title }; }));
    var dtv = a ? toLocalInput(a.datetime) : (preset.datetime || toLocalInput(new Date(Date.now() + 3600000).toISOString()));
    var syncDefault = a ? !!a.googleEventId : (preset.gsync != null ? preset.gsync : tokenValid());
    openModal(a ? "Editar actividad" : (preset.type === "reunion" ? "Agendar reunión" : "Nueva actividad"), [
      { name: "title", label: "Título", required: true, value: (a && a.title) || preset.title },
      { name: "type", label: "Tipo", type: "select", value: a ? a.type : (preset.type || "reunion"), options: TYPES.map(function (t) { return { value: t.id, label: t.label }; }) },
      { name: "datetime", label: "Fecha y hora", type: "datetime-local", required: true, value: dtv },
      { name: "durationMin", label: "Duración (min)", type: "number", step: "15", value: a ? a.durationMin : 45 },
      { name: "contactId", label: "Contacto", type: "select", value: (a && a.contactId) || preset.contactId, options: contactOpts },
      { name: "dealId", label: "Negocio", type: "select", value: (a && a.dealId) || preset.dealId, options: dealOpts },
      { name: "notes", label: "Notas", type: "textarea", value: a && a.notes },
      { name: "gsync", label: "Añadir a Google Calendar al guardar", type: "checkbox", value: syncDefault }
    ], function (f) {
      var isNew = !a;
      var payload = {
        title: f.title, type: f.type,
        datetime: new Date(f.datetime).toISOString(),
        durationMin: Number(f.durationMin) || 30,
        contactId: f.contactId || null, dealId: f.dealId || null, notes: f.notes || ""
      };
      if (a) Object.assign(a, payload);
      else { a = Object.assign({ id: uid("a"), done: false, googleEventId: null }, payload); state.activities.push(a); }
      state.isDemo = false; save(); closeModal(); refresh();
      toast(isNew ? "Actividad creada" : "Actividad guardada");
      if (f.gsync && !a.googleEventId) maybeSyncActivity(a);
    });
  }
  function maybeSyncActivity(a) {
    if (tokenValid()) { pushActivityToGoogle(a); }
    else if (runtime.gsi === false) { toast("Guardado en el CRM · Google no disponible en este entorno"); }
    else { toast("Guardado · conecta Google Calendar en Configuración para sincronizar"); }
  }
  function toLocalInput(iso) {
    var d = new Date(iso);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") +
      "T" + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  // ============ DRAWER (contact detail) ============
  function openContactDrawer(id) {
    var c = contactById(id);
    if (!c) return;
    var deals = state.deals.filter(function (d) { return d.contactId === id; });
    var acts = state.activities.filter(function (a) { return a.contactId === id; }).sort(function (a, b) { return new Date(b.datetime) - new Date(a.datetime); });
    $("#drawer").innerHTML =
      '<div class="drawer-head">' +
        '<div class="avatar lg">' + esc(initials(c.name).toUpperCase()) + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<h3 style="font-size:16px">' + esc(c.name) + '</h3>' +
          '<div class="cell-sub">' + esc(c.company || "—") + '</div>' +
          '<div style="margin-top:6px">' + (c.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join(" ") + '</div>' +
        '</div>' +
        '<button class="btn ghost sm" id="drawerClose" aria-label="Cerrar">✕</button>' +
      '</div>' +
      '<div class="drawer-body">' +
        '<h4>Contacto</h4>' +
        '<dl class="kv">' +
          '<dt>Email</dt><dd>' + esc(c.email || "—") + '</dd>' +
          '<dt>Teléfono</dt><dd>' + esc(c.phone || "—") + '</dd>' +
          '<dt>Propietario</dt><dd>' + esc(c.owner || "—") + '</dd>' +
        '</dl>' +
        '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">' +
          '<button class="btn primary sm" id="drawerMeet"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg> Agendar reunión</button>' +
          '<button class="btn sm" id="drawerEdit">Editar</button>' +
          '<button class="btn sm" id="drawerNewDeal">Nuevo negocio</button>' +
          '<button class="btn sm" id="drawerNewAct">Actividad</button>' +
        '</div>' +
        '<h4>Negocios (' + deals.length + ')</h4>' +
        (deals.length ? deals.map(function (d) {
          return '<div class="mini-deal" data-open-deal="' + d.id + '" style="cursor:pointer">' +
            '<div><div style="font-weight:600;font-size:12.5px">' + esc(d.title.split(" — ")[0]) + '</div>' +
            '<span class="badge s-' + d.stage + '">' + esc(stageLabel(d.stage)) + '</span></div>' +
            '<span class="d-val" style="font-weight:700;font-size:12.5px">' + fmtMoney(d.value) + '</span></div>';
        }).join("") : '<div class="cell-sub">Sin negocios.</div>') +
        '<h4>Actividades (' + acts.length + ')</h4>' +
        (acts.length ? acts.slice(0, 12).map(function (a) {
          return '<div class="row-item" data-edit-activity="' + a.id + '" style="cursor:pointer">' +
            '<div class="type-ic ' + a.type + '">' + typeIconSvg(a.type) + '</div>' +
            '<div class="ri-body"><div class="ri-title">' + esc(a.title) + '</div>' +
            '<div class="ri-meta">' + fmtDate(a.datetime) + ' · ' + fmtTime(a.datetime) + (a.done ? ' · hecho' : '') + '</div></div></div>';
        }).join("") : '<div class="cell-sub">Sin actividades.</div>') +
        '<div style="margin-top:24px"><button class="btn danger sm" id="drawerDelete">Eliminar contacto</button></div>' +
      '</div>';

    $("#drawerScrim").classList.add("on");
    $("#drawer").classList.add("on");
    $("#drawerClose").addEventListener("click", closeDrawer);
    $("#drawerEdit").addEventListener("click", function () { closeDrawer(); openContactModal(c); });
    $("#drawerNewDeal").addEventListener("click", function () { closeDrawer(); openDealModal({ contactId: id, stage: "nuevo", value: 0, title: "" }); });
    $("#drawerNewAct").addEventListener("click", function () { closeDrawer(); openActivityModal(null, { contactId: id }); });
    $("#drawerMeet").addEventListener("click", function () {
      closeDrawer();
      openActivityModal(null, { type: "reunion", contactId: id, title: "Reunión con " + c.name, gsync: true });
    });
    $("#drawerDelete").addEventListener("click", function () {
      if (!confirm("¿Eliminar a " + c.name + "? También se eliminan sus negocios y actividades.")) return;
      state.deals = state.deals.filter(function (d) { return d.contactId !== id; });
      state.activities = state.activities.filter(function (a) { return a.contactId !== id; });
      state.contacts = state.contacts.filter(function (x) { return x.id !== id; });
      state.isDemo = false; save(); closeDrawer(); refresh(); toast("Contacto eliminado");
    });
    $all("#drawer [data-open-deal]").forEach(function (el) {
      el.addEventListener("click", function () { closeDrawer(); openDealModal(dealById(el.dataset.openDeal)); });
    });
    $all("#drawer [data-edit-activity]").forEach(function (el) {
      el.addEventListener("click", function () { closeDrawer(); openActivityModal(state.activities.find(function (a) { return a.id === el.dataset.editActivity; })); });
    });
  }
  function closeDrawer() {
    $("#drawerScrim").classList.remove("on");
    $("#drawer").classList.remove("on");
  }

  // ============ THEME ============
  function applyTheme() {
    var t = state.settings.theme || "system";
    if (t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }

  // ============ GLOBAL EVENTS ============
  document.addEventListener("click", function (e) {
    var t = e.target;

    var oc = t.closest("[data-open-contact]");
    if (oc) { openContactDrawer(oc.dataset.openContact); return; }

    var od = t.closest("[data-open-deal]");
    if (od && !t.closest("#drawer")) { openDealModal(dealById(od.dataset.openDeal)); return; }

    var oa = t.closest("[data-open-activity]");
    if (oa) { var act = state.activities.find(function (a) { return a.id === oa.dataset.openActivity; }); if (act) openActivityModal(act); return; }

    var tg = t.closest("[data-toggle]");
    if (tg) {
      e.stopPropagation();
      var a = state.activities.find(function (x) { return x.id === tg.dataset.toggle; });
      if (a) { a.done = !a.done; state.isDemo = false; save(); refresh(); }
      return;
    }

    var gc = t.closest("[data-gcal]");
    if (gc) {
      e.stopPropagation();
      var ga = state.activities.find(function (x) { return x.id === gc.dataset.gcal; });
      if (ga) pushActivityToGoogle(ga);
      return;
    }

    var ea = t.closest("[data-edit-activity]");
    if (ea && !t.closest("#drawer") && currentView !== "calendar") {
      var eact = state.activities.find(function (x) { return x.id === ea.dataset.editActivity; });
      if (eact) openActivityModal(eact);
      return;
    }
    if (ea && currentView === "calendar") {
      var cact = state.activities.find(function (x) { return x.id === ea.dataset.editActivity; });
      if (cact) openActivityModal(cact);
      return;
    }
  });

  // nav
  $all(".nav-item[data-nav]").forEach(function (b) { b.addEventListener("click", function () { go(b.dataset.nav); }); });
  $("#hamburger").addEventListener("click", function () { $("#sidebar").classList.toggle("on"); $("#navScrim").classList.toggle("on"); });
  $("#navScrim").addEventListener("click", function () { $("#sidebar").classList.remove("on"); $("#navScrim").classList.remove("on"); });

  // new menu
  $("#newBtn").addEventListener("click", function (e) { e.stopPropagation(); $("#newMenu").hidden = !$("#newMenu").hidden; });
  document.addEventListener("click", function () { $("#newMenu").hidden = true; });
  $("#newMenu").addEventListener("click", function (e) {
    var b = e.target.closest("[data-new]"); if (!b) return;
    if (b.dataset.new === "contact") openContactModal(null);
    else if (b.dataset.new === "deal") openDealModal(null);
    else openActivityModal(null, {});
  });

  // global search -> contacts
  $("#globalSearch").addEventListener("input", function () {
    contactQuery = this.value;
    if (currentView !== "contacts") go("contacts");
    else renderContacts();
  });

  // google pill
  $("#gPill").addEventListener("click", function () { go("settings"); });
  $("#gPill").addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go("settings"); } });

  // modal
  $("#modalForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (modalSubmit) {
      var form = $("#modalForm");
      if (!form.reportValidity()) return;
      modalSubmit(readForm());
    }
  });
  $("#modalCancel").addEventListener("click", closeModal);
  $("#modalScrim").addEventListener("click", closeModal);
  $("#drawerScrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeModal(); closeDrawer(); $("#newMenu").hidden = true; }
  });

  // demo banner
  $("#clearDemo").addEventListener("click", function () {
    state = { contacts: [], deals: [], activities: [], employees: state.employees, session: state.session, settings: state.settings, isDemo: false };
    save(); $("#demoBanner").hidden = true; refresh();
  });

  // theme toggle
  $("#themeToggle").addEventListener("click", toggleTheme);
  $("#authTheme").addEventListener("click", toggleTheme);
  if (window.matchMedia) {
    try {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        if ((state.settings.theme || "system") === "system") { applyTheme(); updateThemeToggle(); }
      });
    } catch (e) {}
  }

  // auth
  $all("#authView .auth-tabs button").forEach(function (b) {
    b.addEventListener("click", function () { authTab = b.dataset.tab; renderAuthForm(); });
  });
  $("#authForm").addEventListener("submit", submitAuth);

  // ============ INIT ============
  function bootApp() {
    $("#demoBanner").hidden = !state.isDemo;
    renderMe();
    updateThemeToggle();
    updateGooglePill();
    go(location.hash.slice(1) || "dashboard");
    var me = currentEmployee();
    if (me) setTimeout(function () { toast(greeting() + ", " + firstName(me.name)); }, 400);
  }
  try { document.documentElement.lang = LOCALE; } catch (e) {}
  var ms = $("#brandMarkSide"); if (ms) ms.innerHTML = LOGO_SVG;
  var ma = $("#brandMarkAuth"); if (ma) ma.innerHTML = LOGO_SVG;
  applyTheme();
  updateThemeToggle();
  loadGsi();
  if (currentEmployee()) { bootApp(); }
  else { showAuth(); }
})();
</script>
</body>
</html>
